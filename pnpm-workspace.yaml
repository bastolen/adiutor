allowBuilds:
  '@parcel/watcher': false
  # next-intl's optional message extractor; Adiutor doesn't use it, and the prebuilt binary needs no build.
  '@swc/core': false
  esbuild: true
  sharp: false
  # The SFTP storage driver's optional native cipher code: it runs in plain JavaScript without it,
  # and nothing is compiled on a server or in the Docker image.
  ssh2: false
  unrs-resolver: false

# Wait 3 days (in minutes) after a release before pnpm installs it, like Renovate's
# minimumReleaseAge, in case the release is pulled or compromised: for `pnpm add`, `pnpm update`
# and Renovate's lockfile refreshes alike. A security fix that can't wait goes under
# `minimumReleaseAgeExclude` until it's 3 days old.
minimumReleaseAge: 4320

# Advisories checked and found unreachable, so `pnpm audit` (and the CI step) stays quiet until a new
# one appears. Remove an entry once its fix lands (see "Security advisories" in
# docs/ci-and-releases.md).
auditConfig:
  ignoreGhsas:
    # esbuild <= 0.24.2: its development server answers any website's requests. Only drizzle-kit's
    # old esbuild 0.18 (through @esbuild-kit) has it, and nothing starts that server. Drops out with
    # drizzle-kit 1.0, which Renovate will propose once it's stable.
    - GHSA-67mh-4wv8-2f99
    # glob 9.0.0 to 14.0.1 (cancelling a walk doesn't stop it) and minimatch < 11.0.1 (crafted
    # patterns take very long): only react-email's command-line tool loads glob (`pnpm email:dev`,
    # the local preview server, with fixed patterns); the app's emails import react-email's
    # runtime, which never does. Drops out when react-email depends on glob 14.0.2 or newer, which
    # Renovate will propose.
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249

# ssh2's optional cpu-features, which only picks the order of its ciphers: unbuilt (as nothing is
# built here), its entry file requires a native file that isn't there, which keeps Next's
# development server rebuilding and reloading every page that imports ssh2.
ignoredOptionalDependencies:
  - cpu-features
