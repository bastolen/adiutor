# Dependabot: keeps the GitHub Actions in .github/workflows and in the local
# actions under .github/actions up to date. They're
# pinned to exact commits with the version in a comment; Dependabot updates
# both. npm packages and container images are Renovate's (renovate.json5), so
# the two never update the same thing, as long as the repository's "Dependabot
# security updates" stay off (they'd open npm pull requests too).
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows, and the local actions they use (like CI's shared setup).
    directories:
      - /
      - /.github/actions/*
    # Once a week, like Renovate.
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Amsterdam
    # Wait 3 days after a release before updating, in case it's pulled or compromised (like
    # Renovate's minimumReleaseAge).
    cooldown:
      default-days: 3
    # Conventional Commit messages ("ci(deps): bump …"). Their pull request titles can run past
    # commitlint's 100-character limit ("… in the github-actions group across 1 directory"), so
    # commitlint.config.mjs skips them; the ci type keeps them out of the release notes.
    commit-message:
      prefix: ci
      include: scope
    # All action updates in one pull request.
    groups:
      github-actions:
        patterns: ['*']
