# PR title: checks that a pull request's title follows Conventional Commits,
# with the same commitlint rules as the commit-msg hook (commitlint.config.mjs).
# A squash merge lands on main with the PR title, and Release Please builds the
# changelog and the next version from the messages on main, so a title the hook
# never saw must pass the same check.
#
# Runs on `pull_request` (a fork's PR gets a read-only token and no secrets),
# again when the title is edited, and on every new commit, so it can be a
# required check. It's its own workflow, so editing a title doesn't re-run CI.
# An edit that leaves the title alone (Renovate rewrites its descriptions on
# every update) skips the job: it starts no runner, and a skipped job counts
# as passed for a required check.
#
# Actions are pinned to exact commits (version in a comment); Dependabot keeps
# them up to date.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Cancel an older check of the same pull request. Edits that leave the title alone get a group of
# their own: they skip the job, so they must never cancel a check that's still running (say, the
# one for a pull request that was just opened).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.title && '-other-edit' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    name: Conventional Commits title
    # Not for an edit of only the description or base branch: the title is the one already checked.
    if: ${{ github.event.action != 'edited' || github.event.changes.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing is pushed, so the token isn't kept in .git/config.
          persist-credentials: false

      # pnpm, Node and the dependencies (commitlint and its config) as the lockfile has them.
      - uses: ./.github/actions/setup

      # The title comes in through the environment, never pasted into the script, so it can't
      # run as shell code.
      - name: Check the title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
