# Shared setup for CI's jobs (.github/workflows/ci.yml): pnpm (its version from "packageManager"
# in package.json), Node (from .nvmrc, with pnpm's store cached) and the dependencies, exactly as
# the lockfile has them. A job checks out the repository before using it, since the action lives
# there.
#
# Actions are pinned to exact commits (version in a comment); Dependabot keeps them up to date
# (.github/dependabot.yml lists this folder).
name: Set up
description: Installs pnpm, Node and the dependencies from the lockfile.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
